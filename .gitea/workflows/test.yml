name: Test CI
on: [push]

jobs:
  hello:
    runs-on: pi5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print info
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Runner: $(hostname)"
          uname -a
          docker --version