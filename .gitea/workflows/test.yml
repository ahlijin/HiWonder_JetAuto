name: Build ROS
on: [push]

jobs:
  build:
    runs-on: pi5
    steps:
      - uses: actions/checkout@v4
      - name: Build in ros-dev
        run: |
          docker run --rm \
            -v $PWD:/ws \
            -w /ws \
            ros-dev \
            bash -c "source /opt/ros/humble/setup.bash && colcon build"