name: ROS Build
on: [push]

jobs:
  build:
    runs-on: pi5
    steps:
      - name: Clone
        run: |
          rm -rf /data/ws
          git clone http://192.168.3.96:3000/legend/HiWonder_JetAuto /data/ws
          cd /data/ws
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.sha }}
          git submodule update --init --recursive

      - name: Build
        run: |
          docker run --rm \
            -v /home/pi/runner-data/ws:/ws \
            -w /ws \
            my-ros:latest \
            bash -c "source /opt/ros/humble/setup.bash && colcon build"